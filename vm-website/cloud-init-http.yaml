#cloud-config
package_update: true
packages:
  - nginx

ssh_authorized_keys:
  - ${ssh_public_key}

write_files:
  - path: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hello Atlas</title>
        <style>
          body { font-family: system-ui; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
          .container { text-align: center; background: white; padding: 3rem; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
          h1 { color: #333; margin-bottom: 0.5rem; }
          p { color: #666; }
        </style>
      </head>
      <body>
        <div class="container">
          <h1>Hello from Atlas Cloud!</h1>
          <p>Your website is running on HTTP</p>
        </div>
      </body>
      </html>
    permissions: '0644'

runcmd:
  - systemctl enable nginx
  - systemctl start nginx
