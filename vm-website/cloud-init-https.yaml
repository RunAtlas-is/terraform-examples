#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2

ssh_authorized_keys:
  - ${ssh_public_key}

write_files:
  - path: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hello Atlas</title>
        <style>
          body { font-family: system-ui; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
          .container { text-align: center; background: white; padding: 3rem; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
          h1 { color: #333; margin-bottom: 0.5rem; }
          p { color: #666; }
          .secure { color: #11998e; font-weight: bold; }
        </style>
      </head>
      <body>
        <div class="container">
          <h1>Hello from Atlas Cloud!</h1>
          <p>Your website is <span class="secure">secure</span> with HTTPS</p>
        </div>
      </body>
      </html>
    permissions: '0644'

  - path: /opt/traefik/docker-compose.yml
    content: |
      services:
        traefik:
          image: traefik:v3
          command:
            - "--providers.docker=true"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
            - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
            - "--certificatesresolvers.letsencrypt.acme.email=${email_address}"
            - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
            - "letsencrypt:/letsencrypt"
        
        nginx:
          image: nginx:alpine
          labels:
            - "traefik.enable=true"
            - "traefik.http.routers.nginx.rule=Host(`${domain_name}`)"
            - "traefik.http.routers.nginx.entrypoints=websecure"
            - "traefik.http.routers.nginx.tls.certresolver=letsencrypt"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
            - "traefik.http.routers.nginx-http.rule=Host(`${domain_name}`)"
            - "traefik.http.routers.nginx-http.entrypoints=web"
            - "traefik.http.routers.nginx-http.middlewares=redirect-to-https"
          volumes:
            - "/var/www/html:/usr/share/nginx/html:ro"
      
      volumes:
        letsencrypt:
    permissions: '0644'

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - cd /opt/traefik && docker compose up -d
