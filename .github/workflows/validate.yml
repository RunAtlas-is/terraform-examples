name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init and validate
        # Discovers example directories by locating every directory that
        # holds a .tf file, so a new example under a new top-level
        # directory is picked up without a workflow change.
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' dir; do
            echo "== ${dir} =="
            (cd "${dir}" && terraform init -backend=false && terraform validate) || status=1
          done < <(find . -mindepth 1 -name '*.tf' -printf '%h\0' | sort -zu)
          exit "${status}"
